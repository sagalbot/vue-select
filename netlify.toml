# Settings in the [build] context are global and are applied to all contexts
# (production, deploy previews, branch deploys) unless overridden.
# @see https://docs.netlify.com/configure-builds/file-based-configuration/
#
# The docs are a Nuxt site in docs/, a package in the root pnpm workspace,
# so the build runs from the repository root. Legacy VuePress URL redirects
# live in docs/public/_redirects.
[build]
  base = ""
  command = "npm i -g pnpm@9 && pnpm install --frozen-lockfile && pnpm run build:docs"
  publish = "docs/.output/public"

[build.environment]
  NODE_VERSION = "24"
